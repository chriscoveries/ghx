name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run tests
        run: go test -race -count=1 ./...

      - name: Build release archives and checksums
        id: build
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "version_num=${VERSION#v}" >> "$GITHUB_OUTPUT"
          go run ./scripts/release "$VERSION" dist
          (cd dist && sha256sum --check checksums.txt)

      - name: Read archive checksums
        id: checksums
        run: |
          for platform in DARWIN_ARM64 DARWIN_AMD64 LINUX_AMD64 LINUX_ARM64; do
            archive="ghx-$(echo "$platform" | tr '[:upper:]_' '[:lower:]-').tar.gz"
            sum=$(awk -v name="$archive" '$2 == name {print $1}' dist/checksums.txt)
            test -n "$sum"
            echo "SHA_${platform}=${sum}" >> "$GITHUB_OUTPUT"
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
            dist/source.json

      - name: Update Homebrew tap
        if: github.repository == 'brunoborges/ghx' && !contains(github.ref_name, '-')
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          VERSION=${{ steps.build.outputs.version }}
          VERSION_NUM=${{ steps.build.outputs.version_num }}
          BASE_URL="https://github.com/brunoborges/ghx/releases/download/${VERSION}"

          SHA_DARWIN_ARM64=${{ steps.checksums.outputs.SHA_DARWIN_ARM64 }}
          SHA_DARWIN_AMD64=${{ steps.checksums.outputs.SHA_DARWIN_AMD64 }}
          SHA_LINUX_AMD64=${{ steps.checksums.outputs.SHA_LINUX_AMD64 }}
          SHA_LINUX_ARM64=${{ steps.checksums.outputs.SHA_LINUX_ARM64 }}

          cat > ghx.rb << FORMULA
          class Ghx < Formula
            desc "GitHub CLI Cache Proxy — caching daemon for gh to prevent API rate limiting"
            homepage "https://github.com/brunoborges/ghx"
            version "${VERSION_NUM}"
            license "MIT"

            on_macos do
              if Hardware::CPU.arm?
                url "${BASE_URL}/ghx-darwin-arm64.tar.gz"
                sha256 "${SHA_DARWIN_ARM64}"
              else
                url "${BASE_URL}/ghx-darwin-amd64.tar.gz"
                sha256 "${SHA_DARWIN_AMD64}"
              end
            end

            on_linux do
              if Hardware::CPU.arm?
                url "${BASE_URL}/ghx-linux-arm64.tar.gz"
                sha256 "${SHA_LINUX_ARM64}"
              else
                url "${BASE_URL}/ghx-linux-amd64.tar.gz"
                sha256 "${SHA_LINUX_AMD64}"
              end
            end

            def install
              bin.install "ghx"
              bin.install "ghxd"

              # Install the packaged gh shim unless a real (non-shim) gh CLI exists
              real_gh = ENV.fetch("PATH", "").split(File::PATH_SEPARATOR).any? do |dir|
                p = File.join(dir, "gh")
                next unless File.executable?(p)
                !(File.binread(p, 512).include?("ghx-shim") rescue false)
              end
              bin.install "gh" unless real_gh
            end

            def caveats
              <<~EOS
                ghx caches GitHub CLI calls to prevent API rate limiting.
                Use 'ghx' instead of 'gh' to benefit from caching.

                If no 'gh' binary was found during installation, a lightweight
                shim was installed that routes 'gh' calls through ghx.
              EOS
            end

            test do
              assert_match "ghxd", shell_output("#{bin}/ghxd --help")
            end
          end
          FORMULA

          sed -i 's/^          //' ghx.rb

          echo "Generated formula:"
          cat ghx.rb

          # Clone the tap, update formula, push
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/brunoborges/homebrew-tap.git" tap
          mkdir -p tap/Formula
          cp ghx.rb tap/Formula/ghx.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/ghx.rb
          git commit -m "Update ghx to ${VERSION}"
          git push
