# ci-way rollout: Dependabot config (owner order 13 Nov 2026,
# cifast decisions/20261113-dependabot-plan.md). Same rules as the cifast
# ci-way v1.1 pilot: weekly, minor+patch grouped into one PR per ecosystem,
# majors ungrouped for owning-seat LGTM, open-pull-requests-limit 1.
version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "friday"
    open-pull-requests-limit: 1
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "friday"
    open-pull-requests-limit: 1
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
